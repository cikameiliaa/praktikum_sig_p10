
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Jabodetabek</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
        }

        header {
            padding: 10px 16px;
            background: #1f4e79;
            color: #fff;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        #map {
            height: calc(100vh - 44px);
            width: 100%;
        }

        /* Panel pilihan kota */
        .panel {
            position: absolute;
            top: 90px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #999;
            width: 130px;
        }

        .panel h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        .panel button {
            display: block;
            width: 100%;
            padding: 7px;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f5f5f5;
            cursor: pointer;
        }

        .panel button:hover {
            background: #dceaf7;
        }
    </style>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>
</head>

<body>

    <header>
        <h1>Peta Jabodetabek: Jakarta, Bogor, Depok, Tangerang, Bekasi</h1>
    </header>

    <div id="map"></div>

    <!-- Panel pilihan kota -->
    <div class="panel">
        <h3>Pilih Kota</h3>
        <button onclick="pilihKota('Jakarta')">Jakarta</button>
        <button onclick="pilihKota('Bogor')">Bogor</button>
        <button onclick="pilihKota('Depok')">Depok</button>
        <button onclick="pilihKota('Tangerang')">Tangerang</button>
        <button onclick="pilihKota('Bekasi')">Bekasi</button>
        <button onclick="tampilkanSemua()">Tampilkan semua</button>
    </div>

    <script>

        // 1. Koordinat wilayah Jabodetabek
        const dataKota = {
            Jakarta: [-6.2088, 106.8456],
            Bogor: [-6.5971, 106.8060],
            Depok: [-6.4025, 106.7942],
            Tangerang: [-6.1783, 106.6319],
            Bekasi: [-6.2383, 106.9756]
        };

        // 2. Inisialisasi peta
        const map = L.map("map", {
            minZoom: 9,
            maxZoom: 19
        });

        // 3. Basemap OpenStreetMap
        const osm = L.tileLayer(
            "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);

        // 4. Basemap alternatif citra satelit Esri
        const satelit = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                maxZoom: 19,
                attribution: "Tiles &copy; Esri"
            }
        );

        // 5. Membuat marker untuk setiap kota
        const markers = {};

        Object.keys(dataKota).forEach(function(nama) {

            markers[nama] = L.marker(dataKota[nama])
                .bindPopup("<b>" + nama + "</b>")
                .addTo(map);

        });

        // 6. Mengatur tampilan awal seluruh wilayah Jabodetabek
        const batasKota = L.latLngBounds(
            Object.values(dataKota)
        );

        map.fitBounds(batasKota, {
            padding: [40, 40]
        });

        // 7. Fungsi memilih kota
        function pilihKota(nama) {

            map.setView(dataKota[nama], 12);

            markers[nama].openPopup();

        }

        // 8. Fungsi menampilkan seluruh kota
        function tampilkanSemua() {

            map.fitBounds(batasKota, {
                padding: [40, 40]
            });

        }

        // 9. Kontrol pilihan basemap dan marker
        L.control.layers(
            {
                "OpenStreetMap": osm,
                "Citra Satelit": satelit
            },
            {
                "Marker Jakarta": markers.Jakarta,
                "Marker Bogor": markers.Bogor,
                "Marker Depok": markers.Depok,
                "Marker Tangerang": markers.Tangerang,
                "Marker Bekasi": markers.Bekasi
            }
        ).addTo(map);

        // 10. Kontrol skala peta
        L.control.scale({
            imperial: false
        }).addTo(map);

        // 11. Menampilkan koordinat saat peta diklik
        map.on("click", function(e) {

            L.popup()
                .setLatLng(e.latlng)
                .setContent(
                    `Lat: ${e.latlng.lat.toFixed(4)}<br>
                     Lon: ${e.latlng.lng.toFixed(4)}`
                )
                .openOn(map);

        });

    </script>

</body>
</html>
