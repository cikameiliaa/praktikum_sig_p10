{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta Sebaran Petani dan Lahan Pertanian di Pulau Jawa</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; display: flex; flex-direction: column; }

    header { background: #1f6f2d; color: #fff; padding: 10px 18px; display: flex;
             justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 18px; }
    header small { display: block; font-size: 11px; opacity: .85; margin-top: 2px; }
    .pilih { font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .pilih select { padding: 6px 10px; border-radius: 6px; border: 1px solid #cfd8dc;
                    font-size: 13px; background: #fff; min-width: 250px; }

    #map { flex: 1; min-height: 300px; }

    .info, .legend { background: #fff; border-radius: 8px; box-shadow: 0 1px 8px rgba(0,0,0,.3); }
    .info { padding: 10px 14px; font-size: 12.5px; min-width: 260px; }
    .info h4 { margin: 0 0 6px; font-size: 15px; color: #1f6f2d; }
    .info table { width: 100%; border-collapse: collapse; }
    .info td { padding: 2px 0; border-bottom: 1px solid #eee; }
    .info td:last-child { text-align: right; font-weight: 600; padding-left: 14px; }

    .legend { padding: 10px 12px; font-size: 12px; line-height: 1.7; }
    .legend b { display: block; margin-bottom: 4px; }
    .legend .baris { display: flex; align-items: center; gap: 8px; }
    .legend .kotak { width: 16px; height: 16px; border-radius: 3px;
                     border: 1px solid rgba(0,0,0,.25); flex: none; }

    .label-prov { background: none; border: none; }
    .label-prov span { position: absolute; white-space: nowrap; font-size: 11px; font-weight: 700;
                       color: #1a1a1a; pointer-events: none;
                       text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="judul">Peta Sebaran Petani dan Lahan Pertanian di Pulau Jawa</h1>
      <small id="sub">Memuat data...</small>
    </div>
    <div class="pilih">
      <label for="pilih">Warna menurut:</label>
      <select id="pilih"></select>
    </div>
  </header>

  <div id="map"></div>

  <script>
    // ================= KONFIGURASI (boleh diubah) =================
    var BASE = "{% static 'json/' %}";             // -> /static/json/
    var KODE = ['31', '32', '33', '34', '35', '36'];
    var EKSTENSI = '.geojson';                      // ganti '.json' kalau file GeoJSON kamu berekstensi .json
    var SUMBER = 'Sumber data: BPS (Sensus Pertanian 2023)';   // ganti sesuai sumber datamu
    var GESER_LABEL = { '31': [0, -22], '34': [0, 16] };       // geser label [kanan(+)/kiri(-), bawah(+)/atas(-)] dalam px

    var HIJAU = ['#e5f5e0', '#a1d99b', '#74c476', '#31a354', '#006d2c'];

    var INDIKATOR = {
      kepadatan: {
        label: 'Kepadatan penduduk (jiwa/km²)',
        tipe: 'tetap',
        batas: [500, 1000, 1250, 5000],                         // batas kelas, silakan ubah
        warna: ['#1565c0', '#42a5f5', '#43a047', '#fbc02d', '#d32f2f'],   // rendah -> tinggi
        ujung: ['(jarang)', '(sangat padat)'],
        desimal: 0
      },
      jumlah_petani: { label: 'Jumlah petani (orang)',            tipe: 'rentang', warna: HIJAU, desimal: 0 },
      luas_lahan_ha: { label: 'Luas lahan pertanian (hektar)',    tipe: 'rentang', warna: HIJAU, desimal: 0 },
      petani_per_ha: { label: 'Petani per hektar lahan (orang/ha)', tipe: 'rentang', warna: HIJAU, desimal: 1 }
    };

    // ================= PETA DASAR =================
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 18
    });
    var terang = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap, &copy; CARTO', maxZoom: 19
    });

    var map = L.map('map', { layers: [osm] }).setView([-7.3, 110], 7);
    L.control.layers({ 'OpenStreetMap': osm, 'Peta terang': terang }, null, { position: 'bottomright' }).addTo(map);

    var dataPetani = {};    // kode -> data statistik
    var layers = {};        // kode -> layer polygon
    var indikator = 'kepadatan';
    var terpilih = '31';    // provinsi yang ditampilkan di kotak info
    var vmin = 0, vmax = 1;

    // ================= FUNGSI BANTU =================
    // titik label = tengah daratan utama (polygon terbesar), pulau kecil diabaikan
    function titikLabel(geo) {
      var hasil = null, luasMax = -1;
      var fitur = geo.type === 'FeatureCollection' ? geo.features : [geo];
      fitur.forEach(function (f) {
        var g = f.type === 'Feature' ? f.geometry : f;
        if (!g) { return; }
        var polys = g.type === 'Polygon' ? [g.coordinates]
                  : (g.type === 'MultiPolygon' ? g.coordinates : []);
        polys.forEach(function (poly) {
          var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          poly[0].forEach(function (p) {
            if (p[0] < minX) { minX = p[0]; }
            if (p[0] > maxX) { maxX = p[0]; }
            if (p[1] < minY) { minY = p[1]; }
            if (p[1] > maxY) { maxY = p[1]; }
          });
          var luas = (maxX - minX) * (maxY - minY);
          if (luas > luasMax) {
            luasMax = luas;
            hasil = [(minY + maxY) / 2, (minX + maxX) / 2];   // [lat, lng]
          }
        });
      });
      return hasil;
    }

    function fmt(n, dec) {
      dec = dec || 0;
      return Number(n).toLocaleString('id-ID', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    function nilai(d, kunci) {
      if (kunci === 'kepadatan')     { return d.penduduk / d.luas_wilayah_km2; }
      if (kunci === 'petani_per_ha') { return d.jumlah_petani / d.luas_lahan_ha; }
      return Number(d[kunci]);
    }

    function hitungRentang() {
      var vals = [];
      KODE.forEach(function (k) {
        if (dataPetani[k]) { vals.push(nilai(dataPetani[k], indikator)); }
      });
      vmin = Math.min.apply(null, vals);
      vmax = Math.max.apply(null, vals);
    }

    function kelas(v) {
      var cfg = INDIKATOR[indikator];
      if (cfg.tipe === 'tetap') {
        var n = 0;
        cfg.batas.forEach(function (b) { if (v >= b) { n++; } });
        return n;
      }
      if (vmax === vmin) { return 0; }
      var i = Math.floor((v - vmin) / (vmax - vmin) * cfg.warna.length);
      return Math.min(i, cfg.warna.length - 1);
    }

    function gaya(kode) {
      var d = dataPetani[kode];
      return {
        fillColor: d ? INDIKATOR[indikator].warna[kelas(nilai(d, indikator))] : '#cccccc',
        weight: 1, color: '#444444', fillOpacity: 0.85
      };
    }

    // ================= KOTAK INFO (kanan atas) =================
    var info = L.control({ position: 'topright' });
    info.onAdd = function () {
      this._div = L.DomUtil.create('div', 'info');
      L.DomEvent.disableClickPropagation(this._div);
      return this._div;
    };
    info.update = function (kode) {
      var d = dataPetani[kode];
      if (!d) { this._div.innerHTML = '<h4>Info Provinsi</h4>Data belum dimuat'; return; }
      var kepPetani = d.jumlah_petani / d.luas_wilayah_km2;
      var perHa = d.jumlah_petani / d.luas_lahan_ha;
      var lahanPerPetani = d.luas_lahan_ha / d.jumlah_petani;
      this._div.innerHTML =
        '<h4>' + d.nama + ' (Kode ' + d.kode + ')</h4>' +
        '<table>' +
        '<tr><td>Tahun</td><td>' + d.tahun + '</td></tr>' +
        '<tr><td>Luas wilayah</td><td>' + fmt(d.luas_wilayah_km2, 2) + ' km²</td></tr>' +
        '<tr><td>Jumlah penduduk</td><td>' + fmt(d.penduduk) + ' jiwa</td></tr>' +
        '<tr><td>Kepadatan penduduk</td><td>' + fmt(nilai(d, 'kepadatan')) + ' jiwa/km²</td></tr>' +
        '<tr><td>Jumlah petani</td><td>' + fmt(d.jumlah_petani) + ' orang</td></tr>' +
        '<tr><td>Luas lahan pertanian</td><td>' + fmt(d.luas_lahan_ha, 2) + ' ha</td></tr>' +
        '<tr><td>Kepadatan petani</td><td>' + fmt(kepPetani, 1) + ' orang/km²</td></tr>' +
        '<tr><td>Petani per hektar lahan</td><td>' + fmt(perHa, 2) + ' orang/ha</td></tr>' +
        '<tr><td>Lahan per petani</td><td>' + fmt(lahanPerPetani, 2) + ' ha</td></tr>' +
        '</table>';
    };
    info.addTo(map);

    // ================= LEGENDA (kanan bawah) =================
    var legendDiv;
    var legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      legendDiv = L.DomUtil.create('div', 'legend');
      return legendDiv;
    };
    legend.addTo(map);

    function baris(warna, teks) {
      return '<div class="baris"><span class="kotak" style="background:' + warna + '"></span><span>' + teks + '</span></div>';
    }

    function updateLegend() {
      var cfg = INDIKATOR[indikator];
      var html = '<b>' + cfg.label + '</b>';
      var n = cfg.warna.length;

      if (cfg.tipe === 'tetap') {
        var b = cfg.batas;
        for (var i = n - 1; i >= 0; i--) {
          var t;
          if (i === n - 1)  { t = '&gt; ' + fmt(b[n - 2], cfg.desimal) + (cfg.ujung ? ' ' + cfg.ujung[1] : ''); }
          else if (i === 0) { t = '&lt; ' + fmt(b[0], cfg.desimal) + (cfg.ujung ? ' ' + cfg.ujung[0] : ''); }
          else              { t = fmt(b[i - 1], cfg.desimal) + ' – ' + fmt(b[i], cfg.desimal); }
          html += baris(cfg.warna[i], t);
        }
      } else {
        var step = (vmax - vmin) / n;
        for (var j = 0; j < n; j++) {
          html += baris(cfg.warna[j],
            fmt(vmin + step * j, cfg.desimal) + ' – ' + fmt(vmin + step * (j + 1), cfg.desimal));
        }
      }
      legendDiv.innerHTML = html;
    }

    // ================= DROPDOWN =================
    var sel = document.getElementById('pilih');
    Object.keys(INDIKATOR).forEach(function (k) {
      var o = document.createElement('option');
      o.value = k;
      o.textContent = INDIKATOR[k].label;
      sel.appendChild(o);
    });

    function perbaruiWarna() {
      hitungRentang();
      KODE.forEach(function (k) {
        if (layers[k]) { layers[k].setStyle(gaya(k)); }
      });
      updateLegend();
    }

    sel.addEventListener('change', function () {
      indikator = this.value;
      perbaruiWarna();
    });

    // ================= MUAT DATA =================
    function ambil(url) {
      return fetch(url).then(function (res) {
        if (!res.ok) { throw new Error('HTTP ' + res.status + ' pada ' + url); }
        return res.json();
      });
    }

    Promise.all([
      ambil(BASE + 'petani_jawa.json'),
      Promise.all(KODE.map(function (k) { return ambil(BASE + k + EKSTENSI); }))
    ])
    .then(function (hasil) {
      hasil[0].forEach(function (d) { dataPetani[String(d.kode)] = d; });
      var semua = L.featureGroup().addTo(map);

      KODE.forEach(function (kode, i) {
        var lyr = L.geoJSON(hasil[1][i], {
          style: function () { return gaya(kode); },
          onEachFeature: function (feature, layer) {
            layer.on({
              mouseover: function (e) {
                e.target.setStyle({ weight: 3, color: '#000' });
                e.target.bringToFront();
                info.update(kode);
              },
              mouseout: function (e) {
                lyr.resetStyle(e.target);
                info.update(terpilih);
              },
              click: function () {
                terpilih = kode;
                info.update(kode);
              }
            });
          }
        }).addTo(semua);
        layers[kode] = lyr;

        // label nama provinsi di tengah daratan utama
        var nama = dataPetani[kode] ? dataPetani[kode].nama : kode;
        var g = GESER_LABEL[kode] || [0, 0];
        L.marker(titikLabel(hasil[1][i]) || lyr.getBounds().getCenter(), {
          icon: L.divIcon({
            className: 'label-prov',
            html: '<span style="transform:translate(calc(-50% + ' + g[0] + 'px), calc(-50% + ' + g[1] + 'px))">' + nama + '</span>',
            iconSize: [0, 0]
          }),
          interactive: false, keyboard: false
        }).addTo(map);
      });

      perbaruiWarna();
      info.update(terpilih);

      // geser peta ke kiri supaya kotak info tidak menutupi Pulau Jawa
      var kanan = window.innerWidth > 800 ? 290 : 10;
      map.fitBounds(semua.getBounds(), { paddingTopLeft: [10, 10], paddingBottomRight: [kanan, 10] });

      var tahun = hasil[0].length ? hasil[0][0].tahun : '';
      document.getElementById('judul').textContent =
        'Peta Sebaran Petani dan Lahan Pertanian di Pulau Jawa Tahun ' + tahun;
      document.getElementById('sub').textContent = SUMBER;
    })
    .catch(function (err) {
      document.getElementById('sub').textContent = 'Gagal memuat data: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
